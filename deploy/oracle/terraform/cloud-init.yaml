#cloud-config
# Installs Docker and opens 80 and 443 in the host firewall (the Ubuntu image blocks them).
# Cloning the repo and filling .env stay manual: see ../README.md.
package_update: true
runcmd:
  # 2 GB of swap so the image builds fit on the 1 GB Micro shape; harmless on A1.
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker ubuntu
  - iptables -I INPUT 5 -p tcp -m multiport --dports 80,443 -j ACCEPT
  - netfilter-persistent save
