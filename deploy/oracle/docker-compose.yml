# Run from this folder: docker compose up -d --build. Needs a .env beside it (see .env.example).
# PostgreSQL is external (Supabase): DATABASE_URL comes from .env.
services:
  api: &backend
    build: { context: ../.., dockerfile: deploy/oracle/Dockerfile.backend }
    restart: always
    environment: &backend-env
      ENV: production
      LOG_FORMAT: json
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      MODEL_MODE: live
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      KEY_CREDIT_LIMIT_CONFIRMED: "yes"

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 90s # finish the job in hand on SIGTERM

  web:
    build: { context: ../.., dockerfile: deploy/oracle/Dockerfile.web }
    restart: always
    depends_on: [api]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports: ["80:80", "443:443"]
    volumes: [caddy:/data]

volumes:
  caddy: {}
